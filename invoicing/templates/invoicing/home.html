{% extends "base.html" %}
{% block title %}Home{% endblock %}
{% block content %}
<h2>Welcome to the Invoicing App!</h2>
<p>Hello, {{ user.username }}!</p>
<p><a href="{% url 'logout' %}">Logout</a></p>
{% if user.is_superuser or "Admin" in user.groups.all.0.name %}
<p><a href="{% url 'invoicing:restricted_page' %}">Restricted Admin Page</a></p>
{% endif %}
{% endblock %}
